version: '3.8'

services:
  controller:
    image: rust:1.75-bookworm
    container_name: frp-controller
    working_dir: /app
    volumes:
      - ../:/app
    environment:
      - RUST_LOG=info,frp_controller=debug
      - CONTROLLER_API_KEY=test-master-api-key-12345
      - PTERODACTYL_API_KEY=mock-pterodactyl-token
      - FRP_GATEWAY_TOKEN=super-secret-frp-token-123
    command: cargo run --bin frp-controller -- --config /app/examples/controller.toml
    ports:
      - "8080:8080"
    networks:
      - frp-net

  mock-ptero:
    image: node:20-alpine
    container_name: mock-ptero
    command: >
      node -e "
        const http = require('http');
        const server = http.createServer((req, res) => {
          res.setHeader('Content-Type', 'application/json');
          if (req.url.includes('/allocations')) {
            res.end(JSON.stringify({
              data: [
                { attributes: { id: 101, ip: '10.10.0.20', port: 25565, alias: 'survival', assigned: true, server: 1 } },
                { attributes: { id: 102, ip: '10.10.0.20', port: 25566, alias: 'bedrock', assigned: true, server: 2 } }
              ]
            }));
          } else if (req.url.includes('/servers')) {
            res.end(JSON.stringify({
              data: [
                { attributes: { id: 1, uuid: 'srv-java-01', name: 'Java SMP', node: 1, allocation: 101, egg: 1, docker_image: 'ghcr.io/pterodactyl/yolks:java_17' } },
                { attributes: { id: 2, uuid: 'srv-geyser-02', name: 'Geyser Crossplay', node: 1, allocation: 102, egg: 2, docker_image: 'ghcr.io/pterodactyl/yolks:geyser' } }
              ]
            }));
          } else {
            res.end(JSON.stringify({ status: 'ok' }));
          }
        });
        server.listen(8000, () => console.log('Mock Pterodactyl listening on 8000'));
      "
    ports:
      - "8000:8000"
    networks:
      - frp-net

  gateway:
    image: fatedier/frps:v0.60.0
    container_name: frp-gateway-sg
    volumes:
      - ./gateway-frps.toml:/etc/frp/frps.toml
    ports:
      - "7000:7000"
      - "7500:7500"
      - "30000-30050:30000-30050/tcp"
      - "30000-30050:30000-30050/udp"
    networks:
      - frp-net

networks:
  frp-net:
    driver: bridge
